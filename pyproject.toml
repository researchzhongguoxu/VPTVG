[project]
name = "mathexplain"
version = "0.1.0"
description = "A multimodal multi-agent system for generating math explanation videos from problem images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "openai",
    "opencv-python",
    "pillow",
    "imageio-ffmpeg",
    "python-dotenv",
    "sympy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
mathexplain = "mathexplain.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
